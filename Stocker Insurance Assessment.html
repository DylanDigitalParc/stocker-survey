<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How Well Are You Protected? | Stocker Agency</title>
  <meta name="description" content="A 2-minute insurance protection assessment from Stocker Agency." />
  <style>
/* Stocker Agency | Insurance Assessment — styles
   --sa-navy / --sa-navy-line are taken directly from the supplied logo SVG
   (fills #06152d and #1a3154). --sa-blue is still a placeholder accent for
   buttons/links/progress — CONFIRM against the live site's actual accent
   color. --sa-font is still a system-font placeholder — CONFIRM the real
   Stocker Agency site font (see README-integration.md, this couldn't be
   read directly from stockeragency.com). */

:root {
  --sa-navy: #06152d;       /* from logo SVG fill */
  --sa-navy-dark: #030b18;
  --sa-navy-line: #1a3154;  /* from logo SVG underline strokes */
  --sa-blue: #1d6fa5;       /* CONFIRM: placeholder accent, not from the logo */
  --sa-blue-light: #e8f1f8;
  --sa-accent: #2e9e6b; /* used sparingly: success/strength */
  --sa-amber: #b9781f; /* used sparingly: opportunity */
  --sa-text: #1a2530;
  --sa-text-muted: #56636e;
  --sa-border: #d7dee4;
  --sa-bg: #f6f8fa;
  --sa-white: #ffffff;
  --sa-danger: #b3261e;
  --sa-focus: #1d6fa5;
  --sa-radius: 10px;
  /* CONFIRM: real Stocker Agency site font. Placeholder system-font stack. */
  --sa-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --sa-max-width: 640px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--sa-bg);
  color: var(--sa-text);
  font-family: var(--sa-font);
  line-height: 1.5;
}

/* Rounded corners + a floating card are the default (this is what most
   people see — any normal desktop browser window). Only a genuinely narrow
   phone screen goes full-bleed/edge-to-edge below. Previously this was
   inverted (square by default, rounded only above 720px), which is why the
   corners looked like they "weren't working" in an ordinary window. */
.sa-app {
  max-width: var(--sa-max-width);
  margin: 24px auto;
  min-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  background: var(--sa-white);
  box-shadow: 0 0 0 1px var(--sa-border), 0 4px 16px rgba(6, 21, 45, 0.06);
  border-radius: 16px;
  overflow: hidden;
}

@media (max-width: 480px) {
  .sa-app {
    margin: 0;
    min-height: 100vh;
    border-radius: 0;
    box-shadow: none;
  }
}

/* Header / progress */
.sa-header {
  background: var(--sa-navy);
  color: var(--sa-white);
  padding: 18px 20px 16px;
}
.sa-header__brand {
  display: flex;
  align-items: center;
  margin-bottom: 14px;
}
.sa-logo {
  height: 26px;
  width: auto;
  display: block;
  /* The source SVG is drawn in navy (#06152d); on a navy header we need it
     white. brightness(0) collapses the artwork to solid black regardless of
     its own fills, then invert(1) flips that to white — avoids having to
     hand-edit every fill inside the SVG markup itself. */
  filter: brightness(0) invert(1);
}
.sa-progress-label {
  font-size: 12px;
  color: #c9dcec;
  margin-bottom: 6px;
}
.sa-progress-track {
  height: 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.18);
  overflow: hidden;
}
.sa-progress-fill {
  height: 100%;
  background: var(--sa-blue);
  transition: width 0.25s ease;
}

/* Main content */
.sa-main {
  flex: 1;
  padding: 28px 20px 20px;
}
/* We focus() #sa-main on every screen change purely so screen readers
   announce the new question — not for sighted keyboard users navigating
   with Tab — so its own focus ring is suppressed. Real keyboard focus
   (Tab-ing to an option or button) still gets a visible ring via
   :focus-visible on those elements below. */
.sa-main:focus {
  outline: none;
}
.sa-step-title {
  font-size: 20px;
  font-weight: 700;
  margin: 0 0 6px;
  color: var(--sa-navy-dark);
}
.sa-step-subtext {
  font-size: 14px;
  color: var(--sa-text-muted);
  margin: 0 0 18px;
}

/* Options */
.sa-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}
.sa-option {
  position: relative;
  border: 1.5px solid var(--sa-border);
  border-radius: var(--sa-radius);
  padding: 14px 16px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
  background: var(--sa-white);
}
.sa-option:hover { border-color: var(--sa-blue); }

/* Round "bubble" indicator for both single-select (radio) and multi-select
   (checkbox) options — deliberately not using the native square checkbox
   look, so every answer bubble reads the same regardless of question type. */
.sa-option input {
  appearance: none;
  -webkit-appearance: none;
  margin-top: 1px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--sa-border);
  background: var(--sa-white);
  flex-shrink: 0;
  cursor: pointer;
  position: relative;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.sa-option input:hover { border-color: var(--sa-blue); }
.sa-option input:checked {
  border-color: var(--sa-blue);
  background: var(--sa-blue);
}
.sa-option input:checked::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #fff;
  transform: translate(-50%, -50%);
}
.sa-option__label { font-size: 15px; }
.sa-option:has(input:checked) {
  border-color: var(--sa-blue);
  background: var(--sa-blue-light);
}
.sa-option input:focus-visible {
  outline: 3px solid var(--sa-focus);
  outline-offset: 2px;
}
.sa-option:focus-within { outline: 3px solid var(--sa-focus); outline-offset: 1px; }

/* Error */
.sa-error {
  color: var(--sa-danger);
  font-size: 13.5px;
  margin: -8px 0 14px;
  display: none;
}
.sa-error.is-visible { display: block; }
[aria-invalid="true"] { border-color: var(--sa-danger) !important; }

/* Footer / nav controls */
.sa-footer {
  padding: 14px 20px 20px;
  display: flex;
  gap: 10px;
  border-top: 1px solid var(--sa-border);
}
.sa-btn {
  appearance: none;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  padding: 13px 18px;
  cursor: pointer;
  font-family: inherit;
}
.sa-btn:focus-visible { outline: 3px solid var(--sa-focus); outline-offset: 2px; }
.sa-btn--primary { background: var(--sa-blue); color: #fff; flex: 1; }
.sa-btn--primary:hover { background: #185f8c; }
.sa-btn--primary:disabled { background: #9fb9c9; cursor: not-allowed; }
.sa-btn--secondary { background: var(--sa-white); color: var(--sa-navy-dark); border: 1.5px solid var(--sa-border); }
.sa-btn--secondary:hover { background: #f0f3f5; }

/* Welcome screen */
.sa-welcome { text-align: center; padding-top: 12px; }
.sa-welcome h1 { font-size: 26px; color: var(--sa-navy-dark); margin: 4px 0 12px; }
.sa-welcome p { color: var(--sa-text-muted); font-size: 15.5px; margin-bottom: 26px; }

/* Lead form */
.sa-field { margin-bottom: 16px; }
.sa-field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--sa-navy-dark); }
.sa-field input[type="text"], .sa-field input[type="email"], .sa-field input[type="tel"] {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--sa-border); border-radius: 8px; font-size: 15px; font-family: inherit;
}
.sa-field input:focus-visible { outline: 3px solid var(--sa-focus); outline-offset: 1px; }
.sa-consent { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; color: var(--sa-text-muted); margin: 18px 0; }
.sa-consent input { margin-top: 3px; accent-color: var(--sa-blue); }

/* Results */
.sa-results-card {
  border: 1.5px solid var(--sa-border);
  border-radius: var(--sa-radius);
  padding: 18px;
  margin-bottom: 14px;
}
.sa-results-card--strength { border-left: 5px solid var(--sa-accent); }
.sa-results-card--opportunity { border-left: 5px solid var(--sa-amber); }
.sa-results-card--next { border-left: 5px solid var(--sa-blue); background: var(--sa-blue-light); }
.sa-results-eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--sa-text-muted); margin-bottom: 6px; }
.sa-results-headline { font-size: 17px; font-weight: 700; margin: 0 0 6px; color: var(--sa-navy-dark); }
.sa-results-body { font-size: 14.5px; color: var(--sa-text); margin: 0; }
.sa-cta {
  display: block; text-align: center; text-decoration: none;
  background: var(--sa-blue); color: #fff; font-weight: 700; font-size: 16px;
  padding: 15px; border-radius: 8px; margin-top: 22px;
}
.sa-cta:hover { background: #185f8c; }

.sa-visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

.sa-config-error {
  border: 1.5px solid var(--sa-danger);
  background: #fdecea;
  border-radius: var(--sa-radius);
  padding: 16px;
  font-size: 14px;
}

</style>
</head>

      .map((id) => CHANGE_TO_KEY[id])
      .filter(Boolean);

    let priorityKey = null;
    for (const key of changeKeysInQ4Order) {
      if (cats.some((c) => c.key === key)) {
        priorityKey = key;
        break; // first Q4-matched category that is actually in play; ties
               // among multiple Q4 changes are broken by Q1 order below if
               // more than one distinct matched category exists.
      }
    }
    // If multiple distinct categories matched Q4, break the tie by Q1 order.
    const distinctMatched = Array.from(new Set(changeKeysInQ4Order.filter((k) => cats.some((c) => c.key === k))));
    if (distinctMatched.length > 1) {
      const byQ1Order = cats.slice().sort((a, b) => a.q1Index - b.q1Index);
      priorityKey = byQ1Order.find((c) => distinctMatched.includes(c.key)).key;
    }
    if (!priorityKey) {
      // Absent any Q4 match, priority = first category selected in Q1 order.
      const byQ1Order = cats.slice().sort((a, b) => a.q1Index - b.q1Index);
      priorityKey = byQ1Order[0].key;
    }

    return cats.map((c) => ({ key: c.key, bank: c.bank, count: c.key === priorityKey ? 2 : 1 }));
  }

  // -----------------------------------------------------------------------
  // buildDynamicQueue(slots, answers)
  //
  // slots: output of allocateSlots(), in display order.
  // answers: map of questionId -> selected option id(s), used to detect the
  //   "B1 = not a business owner" fallback trigger and to skip already-used
  //   questions when rebuilding after a change.
  //
  // Returns { queue: [questionId,...] (length <= 4), configError: bool }
  // -----------------------------------------------------------------------
  function buildDynamicQueue(slots, answers) {
    answers = answers || {};
    const queue = [];
    const usedIds = new Set();

    // Flatten: for each slot in display order, pull `count` questions from
    // its bank in approved order, skipping any already used.
    const pending = slots.map((s) => ({ ...s, remaining: s.count }));

    // First pass: fill from each slot's own bank.
    for (const slot of pending) {
      const bankOrder = CFG.BANK_ORDER[slot.bank] || [];
      for (const qid of bankOrder) {
        if (slot.remaining <= 0) break;
        if (usedIds.has(qid)) continue;
        // Business non-owner exception: once B1 is answered "not a business
        // owner", drop remaining unanswered business questions.
        if (slot.bank === "business" && qid !== "B1" && answers.B1 === "b1_not_owner") {
          continue;
        }
        queue.push(qid);
        usedIds.add(qid);
        slot.remaining -= 1;
      }
    }

    // Second pass: replace any slot that came up short (business dropped,
    // or a property bank ran out) using the next unused question from
    // another applicable selected category, then the fallback bank.
    const otherBanks = Array.from(new Set(slots.map((s) => s.bank))).filter(Boolean);
    const replacementOrder = [...otherBanks, "fallback"];

    let shortfall = 4 - queue.length;
    // Only true shortfall if a slot was explicitly reduced (e.g. business
    // dropped after B1). Recompute from original requested count.
    const totalRequested = slots.reduce((sum, s) => sum + s.count, 0);
    shortfall = Math.max(0, Math.min(totalRequested, 4) - queue.length);

    if (shortfall > 0) {
      for (const bank of replacementOrder) {
        if (shortfall <= 0) break;
        const bankOrder = CFG.BANK_ORDER[bank] || [];
        for (const qid of bankOrder) {
          if (shortfall <= 0) break;
          if (usedIds.has(qid)) continue;
          if (bank === "business" && qid !== "B1" && answers.B1 === "b1_not_owner") continue;
          queue.push(qid);
          usedIds.add(qid);
          shortfall -= 1;
        }
      }
    }

    // Never exceed 4, never repeat (guaranteed by usedIds).
    const trimmed = queue.slice(0, 4);
    const configError = trimmed.length < Math.min(4, slots.reduce((s, x) => s + x.count, 0)) && trimmed.length < 4 && slots.length > 0 && false;
    // configError is only raised if we truly cannot assemble 4 distinct
    // applicable questions from bank+fallback combined (extremely unlikely
    // given the fallback bank always has 3 unused questions in reserve).
    const totalAvailable = new Set([].concat(...Object.values(CFG.BANK_ORDER))).size;
    const trueConfigError = trimmed.length < 4 && totalAvailable - usedIds.size <= 0;

    return { queue: trimmed, configError: trueConfigError };
  }

  // -----------------------------------------------------------------------
  // reconcileAnswers(previousAnswers, activeQuestionIds)
  //
  // Drops any stored dynamic-question answer whose question ID is no longer
  // in the active queue (Section 5: "remove orphaned answers from results
  // and submission"). Universal question answers (Q1-Q4, Q9-Q10) are always
  // preserved.
  // -----------------------------------------------------------------------
  function reconcileAnswers(previousAnswers, activeQuestionIds) {
    const UNIVERSAL_IDS = new Set(["Q1", "Q2", "Q3", "Q4", "Q9", "Q10"]);
    const activeSet = new Set(activeQuestionIds);
    const result = {};
    for (const qid of Object.keys(previousAnswers || {})) {
      if (UNIVERSAL_IDS.has(qid) || activeSet.has(qid)) {
        result[qid] = previousAnswers[qid];
      }
    }
    return result;
  }

  // -----------------------------------------------------------------------
  // selectInsights(answers, dynamicQueue)
  //
  // answers: map questionId -> selected option id (single-select dynamic
  //   questions and Q2/Q3 are single-select).
  // dynamicQueue: array of question ids actually shown (Q5-Q8 content).
  //
  // Returns { strength: {headline, body}, opportunity: {headline, body},
  //           nextStep: string, businessNotApplicable: bool }
  // -----------------------------------------------------------------------
  function selectInsights(answers, dynamicQueue) {
    answers = answers || {};
    dynamicQueue = dynamicQueue || [];

    const q10Option = answers.Q10 ? CFG.Q10.options.find((o) => o.id === answers.Q10) : null;
    const motivation = q10Option ? q10Option.motivation : null;
    const affinityTopics = (LIB.MOTIVATION_TOPIC_AFFINITY[motivation] || []);

    const candidates = []; // { category, topic, tier, priority }

    function addCandidate(question, optionId, priority) {
      if (!question || !optionId) return;
      const opt = question.options.find((o) => o.id === optionId);
      if (!opt || !opt.tier || opt.tier === "neutral" || opt.tier === "not_applicable") return;
      candidates.push({
        category: question.category,
        topic: question.topic,
        tier: opt.tier,
        priority,
      });
    }

    // Dynamic (category-specific) questions — highest base priority.
    dynamicQueue.forEach((qid) => {
      const q = CFG.questionById(qid);
      addCandidate(q, answers[qid], 10);
    });

    // Universal Q2/Q3 — lower base priority, always evaluated.
    addCandidate(
      { category: "universal", topic: "confidence_in_coverage", options: CFG.Q2.options },
      answers.Q2,
      5
    );
    addCandidate(
      { category: "universal", topic: "review_recency", options: CFG.Q3.options },
      answers.Q3,
      5
    );

    function scored(c) {
      return c.priority + (affinityTopics.includes(c.topic) ? 2 : 0);
    }

    const strengthCandidates = candidates.filter((c) => c.tier === "strength").sort((a, b) => scored(b) - scored(a));
    const opportunityCandidates = candidates.filter((c) => c.tier === "opportunity").sort((a, b) => scored(b) - scored(a));

    // Never use the same issue as both strength and opportunity (Section 6).
    let chosenOpportunity = opportunityCandidates[0] || null;
    let chosenStrength = strengthCandidates.find((c) => !chosenOpportunity || c.topic !== chosenOpportunity.topic) || null;
    if (chosenStrength && chosenOpportunity && chosenStrength.topic === chosenOpportunity.topic) {
      // Extremely unlikely given tiers are mutually exclusive per option,
      // but guard anyway by dropping the lower-priority one.
      chosenOpportunity = opportunityCandidates.find((c) => c.topic !== chosenStrength.topic) || null;
    }

    function lookup(candidate, tier) {
      if (!candidate) return null;
      const key = `${candidate.category}:${candidate.topic}`;
      const entry = LIB.TOPIC_COPY[key];
      return entry ? entry[tier] : null;
    }

    const strengthCopy = lookup(chosenStrength, "strength") || LIB.NEUTRAL_STRENGTH;
    const opportunityCopy = lookup(chosenOpportunity, "opportunity") || LIB.NEUTRAL_OPPORTUNITY;
    const nextStep = chosenOpportunity
      ? (LIB.TOPIC_COPY[`${chosenOpportunity.category}:${chosenOpportunity.topic}`] || {}).next_step || LIB.NEUTRAL_NEXT_STEP
      : LIB.NEUTRAL_NEXT_STEP;

    return {
      strength: strengthCopy,
      opportunity: opportunityCopy,
      nextStep,
      strengthInsightId: chosenStrength ? `${chosenStrength.category}:${chosenStrength.topic}` : "neutral",
      opportunityInsightId: chosenOpportunity ? `${chosenOpportunity.category}:${chosenOpportunity.topic}` : "neutral",
    };
  }

  root.StockerRoutingEngine = {
    selectCategories,
    allocateSlots,
    buildDynamicQueue,
    reconcileAnswers,
    selectInsights,
  };
})(typeof window !== "undefined" ? window : globalThis);


/**
 * Stocker Agency | Insurance Assessment — submission adapter
 *
 * Section 8 asks for "an integration adapter so delivery can be switched
 * without changing assessment logic." This file is that adapter: app.js
 * calls window.StockerSubmissionAdapter.submit(payload, config) and never
 * needs to know how the lead actually gets delivered.
 *
 * Three modes are implemented:
 *   "webhook"        — POST JSON to config.SUBMIT_ENDPOINT. Simplest,
 *                       works with any backend/CRM webhook.
 *   "gravity-forms"  — hands the payload to an existing Gravity Forms form
 *                       already embedded on the page, and submits it via
 *                       GF's own AJAX flow so GF's notifications/CRM
 *                       add-ons/entry storage all just work.
 *   "demo"           — no network call at all; resolves after a short delay
 *                       so the results screen can be reviewed before a real
 *                       backend exists. NOT for production use — the whole
 *                       point of Section 7's "never claim success until the
 *                       backend confirms" rule is defeated by this mode, so
 *                       flip SUBMIT_MODE back to "webhook" or
 *                       "gravity-forms" before this goes live.
 *
 * "webhook" and "gravity-forms": retry-safe (idempotency key), never
 * resolve until the backend actually confirms success (Section 7).
 */
(function () {
  "use strict";

  function idempotencyKey(payload) {
    return payload.assessment_id; // one assessment = one lead = one key
  }

  // ---------------------------------------------------------------------
  // Webhook mode
  // ---------------------------------------------------------------------
  async function submitWebhook(payload, config) {
    const res = await fetch(config.SUBMIT_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Idempotency-Key": idempotencyKey(payload),
      },
      body: JSON.stringify(stripInternal(payload)),
    });
    if (!res.ok) {
      throw new Error(`Submission failed (${res.status})`);
    }
    return res.json().catch(() => ({}));
  }

  // ---------------------------------------------------------------------
  // Gravity Forms mode
  //
  // CONFIRM WITH CLIENT before enabling:
  //   - The Gravity Forms form ID to embed on the assessment page.
  //   - GF_FIELD_MAP below, matched to that form's actual field IDs
  //     (visible in the GF form editor as input_<formId>_<fieldId>).
  //   - A hidden, single-line "Payload" field on that GF form to receive
  //     the full JSON handoff payload (Section 8), so nothing is lost even
  //     if the individual mapped fields don't cover every column you want.
  //   - jQuery must be present on the page (Gravity Forms already loads it
  //     in WordPress) for the gform_confirmation_loaded hook below.
  //
  // This deliberately does NOT rebuild GF's fields with our own inputs;
  // it fills the real GF form's inputs and lets GF submit itself, so GF's
  // own validation, spam protection, notifications, and CRM add-ons all
  // keep working unmodified.
  // ---------------------------------------------------------------------
  const GF_FIELD_MAP = {
    // formId: 1,               // CONFIRM: real Gravity Forms form ID
    // firstName: "input_1_3",
    // lastName: "input_1_6",
    // email: "input_1_4",
    // phone: "input_1_5",
    // consent: "input_1_7",      // checkbox input id
    // payloadJson: "input_1_8",  // hidden field for the full JSON payload
  };

  function submitGravityForms(payload, config) {
    return new Promise((resolve, reject) => {
      const formId = GF_FIELD_MAP.formId;
      if (!formId || !window.jQuery) {
        reject(new Error("Gravity Forms integration is not configured yet (see GF_FIELD_MAP in submission-adapter.js)."));
        return;
      }
      const $ = window.jQuery;
      const $form = $(`#gform_${formId}`);
      if ($form.length === 0) {
        reject(new Error(`Gravity Forms form #${formId} was not found on this page.`));
        return;
      }

      $(`#${GF_FIELD_MAP.firstName}`).val(payload.first_name);
      $(`#${GF_FIELD_MAP.lastName}`).val(payload.last_name);
      $(`#${GF_FIELD_MAP.email}`).val(payload.email);
      if (GF_FIELD_MAP.phone && payload.phone) $(`#${GF_FIELD_MAP.phone}`).val(payload.phone);
      if (GF_FIELD_MAP.consent) $(`#${GF_FIELD_MAP.consent}`).prop("checked", !!payload.consent_status);
      if (GF_FIELD_MAP.payloadJson) $(`#${GF_FIELD_MAP.payloadJson}`).val(JSON.stringify(stripInternal(payload)));

      const onConfirmation = function (event, formIdLoaded) {
        if (String(formIdLoaded) !== String(formId)) return;
        $(document).off("gform_confirmation_loaded", onConfirmation);
        resolve({});
      };
      $(document).on("gform_confirmation_loaded", onConfirmation);

      // Standard documented way to submit a Gravity Forms AJAX form
      // programmatically.
      $form.trigger("submit", [true]);

      // Safety timeout: never leave the visitor stuck on "Submitting…".
      setTimeout(() => {
        $(document).off("gform_confirmation_loaded", onConfirmation);
        reject(new Error("Gravity Forms submission timed out — please try again."));
      }, 15000);
    });
  }

  function stripInternal(payload) {
    const clone = Object.assign({}, payload);
    delete clone._resultsForDisplay;
    return clone;
  }

  // ---------------------------------------------------------------------
  // Demo mode — preview only, see the warning in the file header comment.
  // ---------------------------------------------------------------------
  function submitDemo(payload) {
    return new Promise((resolve) => {
      console.info("[Stocker Assessment — DEMO MODE] Lead payload that would be submitted:", stripInternal(payload));
      setTimeout(resolve, 500);
    });
  }

  async function submit(payload, config) {
    if (config.SUBMIT_MODE === "gravity-forms") {
      return submitGravityForms(payload, config);
    }
    if (config.SUBMIT_MODE === "demo") {
      return submitDemo(payload);
    }
    return submitWebhook(payload, config);
  }

  window.StockerSubmissionAdapter = { submit, GF_FIELD_MAP };
})();


/**
 * Stocker Agency | Insurance Assessment — app / UI controller
 *
 * Depends on (load in this order):
 *   assessment-config.js, insight-library.js, routing-engine.js,
 *   submission-adapter.js, then this file.
 */
(function () {
  "use strict";

  const CFG = window.StockerAssessmentConfig;
  const ENG = window.StockerRoutingEngine;

  // ---------------------------------------------------------------------
  // CONFIG — things the client/team need to set before launch.
  // ---------------------------------------------------------------------
  const APP_CONFIG = {
    // CONFIRM (Section 11): real scheduling URL. Do not launch with this.
    SCHEDULING_URL: "#schedule-a-review",
    // "webhook" posts JSON to SUBMIT_ENDPOINT. "gravity-forms" hands off to
    // submission-adapter.js's Gravity Forms integration. See
    // gravity-forms-adapter.js and README-integration.md.
    SUBMIT_MODE: "demo", // preview build — switch to "webhook" or "gravity-forms" for production // "webhook" | "gravity-forms"
    SUBMIT_ENDPOINT: "/wp-json/stocker/v1/assessment-leads", // CONFIRM real endpoint
  };

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  const state = {
    screen: "welcome", // welcome | question | lead | results | config-error | submit-error
    universalIndex: 0, // which universal question we're on, pre-dynamic (0..3 => Q1..Q4)
    phase: "pre-dynamic", // pre-dynamic | dynamic | post-dynamic
    dynamicIndex: 0, // 0..3 within the active dynamic queue
    postIndex: 0, // 0..1 => Q9, Q10
    answers: {}, // questionId -> option id | [option ids]
    q1Order: [], // Q1 selections in click order
    q4Order: [],
    dynamicQueue: [], // array of question ids, e.g. ["H1","H2","A1","A2"]
    categoriesResult: null,
    slots: null,
    configError: false,
    submitting: false,
    submitError: null,
    assessmentId: null,
    startedAt: null,
  };

  const UNIVERSAL_PRE = [CFG.Q1, CFG.Q2, CFG.Q3, CFG.Q4];
  const UNIVERSAL_POST = [CFG.Q9, CFG.Q10];

  function uuid() {
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      const v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);

  }

  // ---------------------------------------------------------------------
  // Recalculation (Section 5): rebuild the dynamic queue any time Q1 or Q4
  // changes, or a fallback-triggering answer (B1) changes. Deterministic
  // from Q1 order + Q4 — never from stale UI state.
  // ---------------------------------------------------------------------
  function recalculate() {
    state.categoriesResult = ENG.selectCategories(state.q1Order, state.q4Order);
    state.slots = ENG.allocateSlots(state.categoriesResult, state.q4Order);
    const { queue, configError } = ENG.buildDynamicQueue(state.slots, state.answers);
    state.dynamicQueue = queue;
    state.configError = configError;
    state.answers = ENG.reconcileAnswers(state.answers, queue);
    // If the current dynamic step no longer exists, clamp forward.
    if (state.phase === "dynamic" && state.dynamicIndex >= state.dynamicQueue.length) {
      state.dynamicIndex = Math.max(0, state.dynamicQueue.length - 1);
    }
  }

  // ---------------------------------------------------------------------
  // Step model: a flat, ordered list of "steps" derived from current state,
  // recomputed on demand so back/forward navigation always reflects the
  // latest recalculation.
  // ---------------------------------------------------------------------
  function currentStepNumber() {
    if (state.phase === "pre-dynamic") return state.universalIndex + 1; // 1-4
    if (state.phase === "dynamic") return 5 + state.dynamicIndex; // 5-8
    return 9 + state.postIndex; // 9-10
  }

  function currentQuestion() {
    if (state.phase === "pre-dynamic") return UNIVERSAL_PRE[state.universalIndex];
    if (state.phase === "dynamic") return CFG.questionById(state.dynamicQueue[state.dynamicIndex]);
    return UNIVERSAL_POST[state.postIndex];

  function goNext() {
    const q = currentQuestion();
    if (!validateCurrent(q)) return;

    if (q.id === "Q1") state.q1Order = state.answers.Q1 || [];
    if (q.id === "Q4") state.q4Order = state.answers.Q4 || [];
    if (q.id === "Q1" || q.id === "Q4" || q.id === "B1") recalculate();

      render();

        state.postIndex = 0;

    } else {

  function shell(innerHtml, opts) {

    const showProgress = opts.showProgress !== false;

    root.innerHTML = `
      <div class="sa-app">
        <div class="sa-header">

          ${showProgress ? `
            <div class="sa-progress-label" aria-hidden="true">Question ${step} of 10</div>

              <div class="sa-progress-fill" style="width:${(step / 10) * 100}%"></div>
            </div>

  function renderWelcome() {

      <div class="sa-app">
        <div class="sa-header">
          <div class="sa-header__brand">${window.STOCKER_LOGO_SVG || '<span style="font-weight:700;">Stocker Agency</span>'}</div>
        </div>
        <main class="sa-main sa-welcome" id="sa-main" tabindex="-1">
          <h1>How Well Are You Protected?</h1>
          <p>Answer a few quick questions about your home, auto, and business coverage. In about two minutes, you'll get personalized insights and a clear next step — no obligation.</p>

          <label class="sa-option">
            <input
              type="${isMulti ? "checkbox" : "radio"}"

              data-exclusive="${!!opt.exclusive}"
              ${checked ? "checked" : ""}
            />
            <span class="sa-option__label">${opt.label}</span>
          </label>
        `;

      .join("");

    shell(`
      <h2 class="sa-step-title">${q.text}</h2>
      ${q.subtext ? `<p class="sa-step-subtext">${q.subtext}</p>` : ""}
      <div class="sa-options" role="group" aria-labelledby="sa-question-heading">
        ${optionsHtml}
      </div>
      <p class="sa-error" id="sa-error" role="alert"></p>
    `);
    renderFooter({ showBack: !(state.phase === "pre-dynamic" && state.universalIndex === 0) });

    root.querySelectorAll(`input[name="${q.id}"]`).forEach((input) => {
      input.addEventListener("change", (e) => {
        const optionId = e.target.value;
        if (isMulti) toggleMulti(q.id, optionId, e.target.dataset.exclusive === "true");
        else selectSingle(q.id, optionId);
      });
    });
    document.getElementById("sa-next-btn").addEventListener("click", goNext);
    const backBtn = document.getElementById("sa-back-btn");
    if (backBtn) backBtn.addEventListener("click", goBack);
  }

  function renderFooter(opts) {
    const footer = document.createElement("div");
    footer.className = "sa-footer";
    footer.innerHTML = `
      ${opts.showBack ? `<button type="button" class="sa-btn sa-btn--secondary" id="sa-back-btn">Back</button>` : ""}
      <button type="button" class="sa-btn sa-btn--primary" id="sa-next-btn">${opts.nextLabel || "Next"}</button>
    `;
    document.querySelector(".sa-app").appendChild(footer);
  }

  function renderLead(isRetry) {
    shell(`
      <h2 class="sa-step-title">Your Insurance Protection Results Are Ready</h2>
      <p class="sa-step-subtext">Tell us where to send them.</p>
      ${isRetry ? `<p class="sa-error is-visible" role="alert">We couldn't submit your results just now. Your answers are saved — please try again.</p>` : ""}
      <form id="sa-lead-form" novalidate>
        <div class="sa-field">
          <label for="sa-first-name">First name</label>
          <input type="text" id="sa-first-name" name="firstName" autocomplete="given-name" required />
        </div>
        <div class="sa-field">
          <label for="sa-last-name">Last name</label>
          <input type="text" id="sa-last-name" name="lastName" autocomplete="family-name" required />
        </div>
        <div class="sa-field">
          <label for="sa-email">Email</label>
          <input type="email" id="sa-email" name="email" autocomplete="email" required />
        </div>
        <div class="sa-field">
          <label for="sa-phone">Phone</label>
          <input type="tel" id="sa-phone" name="phone" autocomplete="tel" required />
        </div>
        <label class="sa-consent">
          <input type="checkbox" id="sa-consent" name="consent" />
          <span>Yes, I'd like to receive occasional emails from Stocker Agency about my coverage and offers. You can unsubscribe anytime.</span>
        </label>
        <p class="sa-error" id="sa-lead-error" role="alert"></p>
        <button type="submit" class="sa-btn sa-btn--primary" id="sa-lead-submit" style="width:100%;">
          ${state.submitting ? "Submitting…" : "See My Results"}
        </button>
      </form>
    `, { showProgress: false });
    renderFooter({ showBack: true, nextLabel: "" });
    document.getElementById("sa-next-btn").remove(); // lead screen uses its own submit button
    document.getElementById("sa-back-btn").addEventListener("click", goBack);
    document.getElementById("sa-lead-form").addEventListener("submit", handleLeadSubmit);
  }

  function isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  async function handleLeadSubmit(e) {
    e.preventDefault();
    if (state.submitting) return; // duplicate-click guard
    const firstName = document.getElementById("sa-first-name").value.trim();
    const lastName = document.getElementById("sa-last-name").value.trim();
    const email = document.getElementById("sa-email").value.trim();
    const phone = document.getElementById("sa-phone").value.trim();
    const consent = document.getElementById("sa-consent").checked;

    const errs = [];
    if (!firstName) errs.push("First name is required.");
    if (!lastName) errs.push("Last name is required.");
    if (!email || !isValidEmail(email)) errs.push("A valid email is required.");
    if (!phone) errs.push("Phone number is required.");

    const errEl = document.getElementById("sa-lead-error");
    if (errs.length) {
      errEl.textContent = errs.join(" ");
      errEl.classList.add("is-visible");
      return;
    }
    errEl.classList.remove("is-visible");

    state.submitting = true;
    document.getElementById("sa-lead-submit").disabled = true;
    document.getElementById("sa-lead-submit").textContent = "Submitting…";

    const payload = buildHandoffPayload({ firstName, lastName, email, phone, consent });

    try {
      await window.StockerSubmissionAdapter.submit(payload, APP_CONFIG);
      state.submitting = false;
      state.screen = "results";
      render();
    } catch (err) {
      state.submitting = false;
      state.submitError = err && err.message ? err.message : "Unknown error";
      state.screen = "submit-error";
      render();
    }
  }

  let lastPayload = null;

  function buildHandoffPayload(contact) {
    const insights = ENG.selectInsights(state.answers, state.dynamicQueue);
    const displayedIds = ["Q1", "Q2", "Q3", "Q4"].concat(state.dynamicQueue, ["Q9", "Q10"]);
    const answersOut = displayedIds
      .filter((qid) => state.answers[qid] !== undefined)
      .map((qid) => {
        const q = qid.match(/^Q/) && ["Q1","Q2","Q3","Q4","Q9","Q10"].includes(qid)
          ? [CFG.Q1, CFG.Q2, CFG.Q3, CFG.Q4, CFG.Q9, CFG.Q10].find((x) => x.id === qid)
          : CFG.questionById(qid);
        const raw = state.answers[qid];
        const optionIds = Array.isArray(raw) ? raw : [raw];
        const optionLabels = optionIds.map((oid) => (q.options.find((o) => o.id === oid) || {}).label || oid);
        return { question_id: qid, option_ids: optionIds, option_labels: optionLabels };
      });

    const cats = state.categoriesResult;
    const usp = new URLSearchParams(window.location.search);

    const payload = {
      assessment_id: state.assessmentId,
      version: CFG.ASSESSMENT_VERSION,
      submitted_at: new Date().toISOString(),
      first_name: contact.firstName,
      last_name: contact.lastName,
      email: contact.email,
      phone: contact.phone || null,
      consent_status: !!contact.consent,
      consent_timestamp: new Date().toISOString(),
      source: "stockeragency.com-assessment",
      utm_source: usp.get("utm_source") || null,
      utm_medium: usp.get("utm_medium") || null,
      utm_campaign: usp.get("utm_campaign") || null,
      utm_term: usp.get("utm_term") || null,
      utm_content: usp.get("utm_content") || null,
      selected_interests: state.q1Order.map((id) => CFG.Q1.options.find((o) => o.id === id).label),
      primary_property_type: cats && cats.propertyType,
      all_selected_property_types: cats ? cats.allSelectedPropertyTypes : [],
      category_priority: state.slots ? state.slots.map((s) => `${s.key}:${s.count}`).join(",") : null,
      answers: answersOut,
      displayed_question_ids: displayedIds,
      fallback_used: state.dynamicQueue.some((qid) => CFG.questionById(qid).category === "fallback"),
      main_concern: deriveMainConcern(),
      agent_relationship: (CFG.Q9.options.find((o) => o.id === state.answers.Q9) || {}).label || null,
      motivation: (CFG.Q10.options.find((o) => o.id === state.answers.Q10) || {}).motivation || null,
      strength_insight_id: insights.strengthInsightId,
      opportunity_insight_id: insights.opportunityInsightId,
      next_step_id: insights.opportunityInsightId,
      _resultsForDisplay: insights, // not part of Section 8 handoff spec; used locally to render the results screen
    };
    lastPayload = payload;
    return payload;
  }

  function deriveMainConcern() {
    // The 4th question in whichever bank contributed the most slots is the
    // closest analog to a "primary concern" selector (H4/C4/R4/A4/B4/F1).
    const focusQ = state.dynamicQueue
      .map((qid) => CFG.questionById(qid))
      .find((q) => q.topic === "focus_preference");
    if (!focusQ) return null;
    const opt = focusQ.options.find((o) => o.id === state.answers[focusQ.id]);
    return opt ? opt.label : null;
  }

  function renderResults() {
    const insights = lastPayload._resultsForDisplay;
    shell(`
      <h2 class="sa-step-title">Your Insurance Protection Results</h2>
      <div class="sa-results-card sa-results-card--strength">
        <div class="sa-results-eyebrow">Strength</div>
        <h3 class="sa-results-headline">${insights.strength.headline}</h3>
        <p class="sa-results-body">${insights.strength.body}</p>
      </div>
      <div class="sa-results-card sa-results-card--opportunity">
        <div class="sa-results-eyebrow">Opportunity</div>
        <h3 class="sa-results-headline">${insights.opportunity.headline}</h3>
        <p class="sa-results-body">${insights.opportunity.body}</p>
      </div>
      <div class="sa-results-card sa-results-card--next">
        <div class="sa-results-eyebrow">Recommended next step</div>
        <p class="sa-results-body">${insights.nextStep}</p>
      </div>
      <a class="sa-cta" href="${APP_CONFIG.SCHEDULING_URL}">Schedule a Coverage Review</a>
      <p style="font-size:12px;color:var(--sa-text-muted);margin-top:14px;">
        These results are based on your answers only, not a review of your actual policies.
        An agent can confirm the details with you.
      </p>
    `, { showProgress: false });
  }

  function renderConfigError() {
    shell(`
      <div class="sa-config-error" role="alert">
        We couldn't build a complete set of questions for your selections. This has been logged
        for our team — please try again, or contact us directly.
      </div>
    `, { showProgress: false });
  }

  // Kick off
  render();
})();

  </script>
</body>
</html>
